<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Logic Team | 官方入口</title>
    <style>
        :root {
            --powder-blue: #B0E0E6;
            --powder-pink: #FFB6C1;
            --text-color: #555;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--powder-blue) 0%, var(--powder-pink) 100%);
            color: var(--text-color);
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        h1 { color: #444; margin-bottom: 0.5rem; }
        p { line-height: 1.6; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 2rem;
        }
        .btn {
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary { background-color: var(--powder-blue); color: #444; }
        .btn-secondary { background-color: var(--powder-pink); color: #444; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .footer { margin-top: 2rem; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Origin Logic Team</h1>
        <p>專注於極簡功能與邏輯美學的開發團隊</p>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 1.5rem 0;">
        
        <div class="works">
            <h3>🌸 核心作品：Sily Timer</h3>
            <p>純粹的粉系計時體驗，支援滅屏倒數。</p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary">下載 APK (Android)</a>
                <a href="#" class="btn btn-primary">下載 EXE (Windows)</a>
            </div>
        </div>

        <div class="footer">
            Copyright © 2026 Origin Logic Team.<br>
            此為非商標之獨立開發專案小組。
        </div>
    </div>
</body>
</html>
