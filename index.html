<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Logic Team | 啟源邏輯</title>
    <style>
        /* --- E-ink Style Layer --- */
        :root {
            --e-paper-white: #F4F4F4;
            --e-paper-black: #1A1A1A;
            --brick-red: #B22222;
            --olive-green: #556B2F;
            --slate-blue: #5F9EA0;
        }

        body {
            background-color: var(--e-paper-white);
            color: var(--e-paper-black);
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 5vw 2vw;
            display: flex;
            justify-content: center;
        }

        #theater-stage {
            width: 100%;
            max-width: 800px;
            border: 2px solid var(--e-paper-black);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        header {
            border-bottom: 3px double var(--e-paper-black);
            margin-bottom: 40px;
            padding-bottom: 20px;
        }

        header h1 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
        header p { margin: 10px 0 0 0; font-size: 0.9rem; opacity: 0.8; }

        /* --- Actors (App Entry) --- */
        .app-entry {
            border: 1px solid var(--e-paper-black);
            margin-bottom: 25px;
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .u-icon {
            font-size: 2.2rem;
            width: 60px;
            text-align: center;
            user-select: none;
            margin-right: 20px;
        }

        .app-info { flex-grow: 1; }
        .app-info h3 { margin: 0; font-size: 1.1rem; }
        .app-status { font-size: 0.8rem; margin-top: 6px; font-weight: bold; }

        /* --- Sliy's Nav Links --- */
        .action-group { display: flex; flex-direction: column; gap: 8px; }
        .action-group a {
            color: var(--e-paper-black);
            text-decoration: none;
            border: 1px solid var(--e-paper-black);
            padding: 4px 12px;
            font-size: 0.75rem;
            text-align: center;
        }

        /* Color Management by Ken */
        .c-brick-red { color: var(--brick-red); }
        .c-olive-green { color: var(--olive-green); }
        .c-slate-blue { color: var(--slate-blue); }

        footer {
            margin-top: 60px;
            font-size: 0.75rem;
            border-top: 1px solid var(--e-paper-black);
            padding-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="theater-stage">
    <header>
        <h1>ORIGIN LOGIC TEAM</h1>
        <p>PROTOCOL 2.1 | DISPATCHER_MODE_STATIC</p>
    </header>

    <main id="ken_APP_LIST">
        <p>LOADING_SYSTEM_RESOURCES...</p>
    </main>

    <footer>
        <div style="margin-bottom: 10px;">
            NODE_CLUSTER: [olt:155] [ws:126] [backup:20]<br>
            OS_ENV: ARCH_LINUX_HEADLESS
        </div>
        <div>© 2026 ORIGIN LOGIC TEAM. ALL ASSETS ENCRYPTED OR ISOLATED.</div>
    </footer>
</div>

<script>
    /* --- 劇組人員實作 (Staff Implementation) --- */

    // 【場務員】tokine_: 數據加載與舞台渲染
    async function tokine_BootTheater() {
        const stage = document.getElementById('ken_APP_LIST');
        try {
            const response = await fetch('./jan_APP_REGISTRY.json');
            if (!response.ok) throw new Error('ERR_DATA_STREAM_FAILED');
            const data = await response.json();
            
            stage.innerHTML = '';
            data.apps.forEach(app => {
                const entry = document.createElement('div');
                entry.className = 'app-entry';
                entry.innerHTML = `
                    <div class="u-icon ${ken_SetTheme(app.u_theme)}">${app.u_char}</div>
                    <div class="app-info">
                        <h3>${app.name}</h3>
                        <div class="app-status">[${app.status}] | DEVICE: ${app.device}</div>
                    </div>
                    <div class="action-group">
                        <a href="${sliy_Route(app.repo_path, 'log')}">LOG_INDEX</a>
                        <a href="${sliy_Route(app.repo_path, 'bin')}">GET_BINARY</a>
                    </div>
                `;
                stage.appendChild(entry);
            });
        } catch (e) {
            stage.innerHTML = `<div class="c-brick-red">SYSTEM_HALT: ${e.message}</div>`;
        }
    }

    // 【引導員】sliy_: 路徑分流邏輯
    function sliy_Route(repo, mode) {
        const org = "origin-logic-team";
        if (mode === 'bin') return `https://github.com/${org}/${repo}/releases`;
        return `https://${org}.github.io/${repo}/`;
    }

    // 【燈光師】ken_: 視覺套色
    function ken_SetTheme(t) {
        const themes = { "brick-red": "c-brick-red", "olive-green": "c-olive-green", "slate-blue": "c-slate-blue" };
        return themes[t] || "c-slate-blue";
    }

    window.onload = tokine_BootTheater;
</script>

</body>
</html>
